# ::: {.project-header}
#[EVAct: 耦合离散分布与连续估计的自适应体素演化高精度VLA策略研发](https://github.com/qiyuanlanniao/DirectVLA){.project-title}
#[Co-first Author, CVPR (CCF-A, Under Review)]{.project-date}
#:::
#::: {.project-desc}
#针对传统离散VLA精度受限与连续扩散策略延迟高的瓶颈，主导研发了耦合离散概率预测与连续动作估计的实时策略EVAct。项目基于DINOv3与BERT构建轻量骨干，提出自适应动作体素演化机制，结合坐标体素嵌入打分、局部邻域连续聚合与不确定性弹性外扩。在单张RTX 4090上以仅0.2B参数量和<1 GB显存实现~32Hz高频实时控制。在 LIBERO(98.7%)、Meta-World (86.8%)及ROKAE双臂实机(75.0%)上完成高鲁棒性闭环验证。
#:::
#::: {.project-header}
#[Zoom In, Don’t Lock In: Evolving Action Voxels for Vision-Language-Action Models](https://github.com/qiyuanlanniao/DirectVLA){.project-title}
#[Co-first Author, CVPR (CCF-A, Under Review)]{.project-date}
#:::
#::: {.project-desc}
#To address the limitations of traditional discrete Vision-Language-Action (VLA) models—namely, restricted precision and the high latency inherent in continuous diffusion-based strategies—we developed EVAct, a real-time policy framework that couples discrete probabilistic prediction with continuous action estimation. The model utilizes a lightweight backbone built upon DINOv3 and BERT, and incorporates an adaptive action-voxel evolution mechanism. This approach integrates coordinate-voxel embedding-based scoring, continuous aggregation within local neighborhoods, and uncertainty-aware, elastic expansion. With only 0.2 billion parameters and a VRAM footprint of less than 1 GB, EVAct achieves high-frequency, real-time control at approximately 32 Hz on a single RTX 4090 GPU. Its robust closed-loop performance has been validated across the LIBERO (98.7%) and Meta-World (86.8%) benchmarks, as well as on a physical ROKAE dual-arm robotic system (75.0%).
#:::

